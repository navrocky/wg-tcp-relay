# /etc/sysctl.d/90-wg-tcp-relay.conf (both servers), apply with: sysctl --system
# See docs/tuning.md.

# BBR + fq: much better than cubic on lossy long-haul links (needs the tcp_bbr module).
# Making bbr the default also allows unprivileged processes to select it.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# Keep unsent data out of kernel socket buffers: less queueing inside the tunnel.
net.ipv4.tcp_notsent_lowat = 131072

# Let the relay get the 8 MiB UDP buffers it asks for (entry server).
net.core.rmem_max = 67108864
net.core.wmem_max = 67108864
