<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 128" width="560" height="128" role="img" aria-label="wg-tcp-relay">
  <style>
    .name { fill: #1f2328; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; font-weight: 700; font-size: 58px; letter-spacing: -1px; }
    .accent { fill: #0969da; }
    @media (prefers-color-scheme: dark) {
      .name { fill: #e6edf3; }
      .accent { fill: #4493f8; }
    }
  </style>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f6feb"/>
