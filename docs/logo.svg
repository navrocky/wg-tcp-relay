      <path d="M22 94 C 44 94, 42 64, 62 64" stroke="#f2b33d"/>
      <path d="M22 64 L 62 64" stroke="#3fd46a"/>
    </g>
    <rect x="56" y="50" width="54" height="28" rx="14" fill="#ffffff"/>
    <rect x="66" y="60" width="9" height="8" rx="2" fill="#ff6b61"/>
    <rect x="79" y="60" width="9" height="8" rx="2" fill="#3fd46a"/>
    <rect x="92" y="60" width="9" height="8" rx="2" fill="#f2b33d"/>
  </g>
  <text class="name" x="140" y="84">wg-<tspan class="accent">tcp</tspan>-relay</text>
</svg>
