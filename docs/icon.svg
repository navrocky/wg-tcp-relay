<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="wg-tcp-relay">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f6feb"/>
      <stop offset="1" stop-color="#0a3069"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#tile)"/>
  <!-- three peers converge... -->
  <g fill="none" stroke-width="9" stroke-linecap="round">
    <path d="M22 34 C 44 34, 42 64, 62 64" stroke="#ff6b61"/>
    <path d="M22 94 C 44 94, 42 64, 62 64" stroke="#f2b33d"/>
    <path d="M22 64 L 62 64" stroke="#3fd46a"/>
  </g>
  <!-- ...into one TCP connection -->
  <rect x="56" y="50" width="54" height="28" rx="14" fill="#ffffff"/>
  <rect x="66" y="60" width="9" height="8" rx="2" fill="#ff6b61"/>
  <rect x="79" y="60" width="9" height="8" rx="2" fill="#3fd46a"/>
  <rect x="92" y="60" width="9" height="8" rx="2" fill="#f2b33d"/>
</svg>
